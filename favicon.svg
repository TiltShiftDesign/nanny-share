<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A98FF"/><stop offset="1" stop-color="#2F7BE0"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#bg)"/>
  <!-- baby head -->
  <g transform="translate(118 126)">
    <!-- ears -->
    <circle cx="-76" cy="4" r="14" fill="#FFE3CF"/><circle cx="76" cy="4" r="14" fill="#FFE3CF"/>
    <circle cx="-76" cy="4" r="7" fill="#F8C7AC"/><circle cx="76" cy="4" r="7" fill="#F8C7AC"/>
    <!-- face -->
    <circle r="78" fill="#FFE9D8"/>
    <!-- hair curl -->
    <path d="M-4 -78 C -4 -98, 18 -102, 20 -88 C 21 -80, 10 -78, 8 -84" fill="none" stroke="#C98A14" stroke-width="7" stroke-linecap="round"/>
    <!-- eyes (happy, closed) -->
    <path d="M-44 -6 q 14 -16 28 0" fill="none" stroke="#1F2340" stroke-width="7" stroke-linecap="round"/>
    <path d="M16 -6 q 14 -16 28 0" fill="none" stroke="#1F2340" stroke-width="7" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="-48" cy="20" r="11" fill="#FFB3B8" opacity=".85"/><circle cx="48" cy="20" r="11" fill="#FFB3B8" opacity=".85"/>
    <!-- smile -->
    <path d="M-16 30 q 16 16 32 0" fill="none" stroke="#1F2340" stroke-width="7" stroke-linecap="round"/>
  </g>
  <!-- clock badge -->
  <g transform="translate(190 190)">
    <circle r="50" fill="#2F7BE0"/>
    <circle r="42" fill="#FFC83D"/>
    <circle r="33" fill="#FFF6DC"/>
    <g stroke="#1F2340" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M0 0 V-21"/><path d="M0 0 H15"/>
    </g>
    <circle r="4.5" fill="#1F2340"/>
    <g fill="#1F2340"><circle cx="0" cy="-27" r="2.5"/><circle cx="27" cy="0" r="2.5"/><circle cx="0" cy="27" r="2.5"/><circle cx="-27" cy="0" r="2.5"/></g>
  </g>
</svg>
